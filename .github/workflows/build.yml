name: Derle (.cs3)

on:
  push:
    branches: [main, master]
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Eklentiyi derle
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Çıktıları topla
        run: |
          mkdir -p out
          cp IPTVProvider/build/*.cs3 out/
          cp build/plugins.json out/
          printf '{"name":"Darknes Lord","description":"Darknes Lord IPTV","manifestVersion":1,"pluginLists":["https://raw.githubusercontent.com/%s/builds/plugins.json"]}\n' "$GITHUB_REPOSITORY" > out/repo.json
          ls -la out

      # Telefonuna doğrudan indirmek için
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVProvider-cs3
          path: out/IPTVProvider.cs3

      # CloudStream'e depo (repository) olarak eklemek için "builds" dalına yayınlar
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: out
          clean: true
          single-commit: true
